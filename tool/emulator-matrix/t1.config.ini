# Tier 1 — 1.5 GB built-in TV (Hisense-like) ★ GATE TIER
#   Real device: Hisense A6/U6 1.5 GB, TCL 1.5 GB
#   System image: system-images;android-31;android-tv;armeabi-v7a if
#   available, else google_apis;armeabi-v7a + force TV mode in the app
#   (a 32-bit TV image is not guaranteed to be published for API 31 —
#   record which image was used in the run log).
#   Launch: emulator -avd pleztv-t1 -netspeed 1000:1000 -netdelay 30:80 -wipe-data  (1 Mbps)
#   Expected tier detection: reduced (auto: 32-bit, lowRam, ~1.4GiB)
#   What it proves: memory shape, tier detection, watchdog behaviour,
#   guide/feed peak shape.
avd.ini.encoding=UTF-8
AvdId=pleztv-t1
avd.ini.displayname=PlezTV Tier 1 — 1.5 GB TV
hw.ramSize=1536
vm.heapSize=256
hw.cpu.ncore=2
hw.cpu.arch=arm
abi.type=armeabi-v7a
hw.lcd.width=1920
hw.lcd.height=1080
hw.lcd.density=320
disk.dataPartition.size=4096M
hw.gpu.mode=swiftshader_indirect
hw.device.name=tv_1080p
PlayStore.enabled=false
hw.keyboard=yes
hw.mainKeys=no
hw.trackBall=no
