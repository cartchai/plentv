# Tier 3 — 3 GB mid (onn 4K Pro / Shield-class)
#   Real device: onn 4K Pro (3 GB), Shield TV (3 GB), 3 GB phones
#   System image: system-images;android-33;google-tv;arm64-v8a
#   (or android-tv if google-tv is unavailable)
#   Launch: emulator -avd pleztv-t3 -netspeed full -netdelay none -wipe-data  (unthrottled)
#   Expected tier detection: full — NOTE the gate gap from low-end
#   item #6: a 4 GB Streamer-class device gets the full tier today.
#   What it proves: Streamer startup-crash shape (the intermittent
#   4 GB crash) at 3 GB; the mid-tier budgets.
avd.ini.encoding=UTF-8
AvdId=pleztv-t3
avd.ini.displayname=PlezTV Tier 3 — 3 GB mid
hw.ramSize=3072
vm.heapSize=512
hw.cpu.ncore=4
hw.cpu.arch=arm64
abi.type=arm64-v8a
hw.lcd.width=1920
hw.lcd.height=1080
hw.lcd.density=320
disk.dataPartition.size=8192M
hw.gpu.mode=host
hw.device.name=tv_1080p
PlayStore.enabled=false
hw.keyboard=yes
hw.mainKeys=no
hw.trackBall=no
