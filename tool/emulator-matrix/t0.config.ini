# Emulator matrix per tier (L-57 / T4-8) — one AVD per tier.
#
# Creation (all tiers):
#   sdkmanager "system-images;android-<API>;<variant>;<ABI>"
#   avdmanager create avd -n pleztv-t<N> -k "system-images;android-<API>;<variant>;<ABI>" -d <device>
# Then edit ~/.android/avd/pleztv-t<N>.avd/config.ini with the values in
# the t<N>.config.ini file in this directory (edit with the emulator
# stopped — AVD Manager rewrites some keys on edit; verify with grep
# after saving).
#
# Launch (fresh run = clear data; omit -wipe-data for a cold run with
# kept data):
#   emulator -avd pleztv-t<N> -netspeed <up>:<down> -netdelay <min>:<max> -wipe-data
#
# Network throttle is a LAUNCH flag, not a config.ini value — the
# -netspeed / -netdelay for each tier is listed in its file header.
# The throttle is bandwidth + latency only, not jitter or packet loss;
# for those, layer a proxy (Charles/Toxiproxy) between the emulator
# and the mock server.
#
# Rule (T4 §9): an emulator pass is a REGRESSION gate, never a ship
# gate — a build that fails on the Tier-1 emulator does not ship; a
# build that passes on it still needs the real Hisense / Fire Stick run.
# See cannot-prove.md for what no emulator can ever prove.

# Tier 0 — 1 GB stick/TV (opens-only, NOT a gate tier)
#   Real device: Fire Stick Lite (1 GB), Chromecast HD (1.5 GB)
#   System image: system-images;android-30;google_apis;armeabi-v7a
#   Launch: emulator -avd pleztv-t0 -netspeed 100:100 -netdelay 100:300 -wipe-data  (2G ~100 kbps)
#   Expected tier detection: reduced (auto: 32-bit, lowRam, ~0.9GiB)
#   What it proves: opens without instant LMK kill; nothing else.
avd.ini.encoding=UTF-8
AvdId=pleztv-t0
avd.ini.displayname=PlezTV Tier 0 — 1 GB stick
hw.ramSize=1024
vm.heapSize=192
hw.cpu.ncore=2
hw.cpu.arch=arm
abi.type=armeabi-v7a
hw.lcd.width=1280
hw.lcd.height=720
hw.lcd.density=213
disk.dataPartition.size=2048M
hw.gpu.mode=swiftshader_indirect
hw.device.name=tv_720p
PlayStore.enabled=false
hw.keyboard=yes
hw.mainKeys=no
hw.trackBall=no
