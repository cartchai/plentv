# Tier 4 — 4 GB Google TV Streamer (control, not low-end)
#   Real device: Google TV Streamer (4 GB, Google TV / Android 14);
#   Fold control run uses the phone skin instead (see README).
#   System image: system-images;android-34;google-tv;arm64-v8a
#   (or android-tv if google-tv is unavailable)
#   Launch: emulator -avd pleztv-t4 -netspeed full -netdelay none -wipe-data  (unthrottled)
#   Expected tier detection: full (4 GB, 64-bit, lowRam false)
#   What it proves: control — same script, same fixture, high-end.
#   The delta vs Tier 1 is the low-end cost.
avd.ini.encoding=UTF-8
AvdId=pleztv-t4
avd.ini.displayname=PlezTV Tier 4 — 4 GB Streamer
hw.ramSize=4096
vm.heapSize=512
hw.cpu.ncore=4
hw.cpu.arch=arm64
abi.type=arm64-v8a
hw.lcd.width=1920
hw.lcd.height=1080
hw.lcd.density=320
disk.dataPartition.size=8192M
hw.gpu.mode=host
hw.device.name=tv_1080p
PlayStore.enabled=false
hw.keyboard=yes
hw.mainKeys=no
hw.trackBall=no
