# PlenTV — Baseline-profile generation + startup measurement (1.5.3 S1)
#
# Why: `android/app/src/main/baseline-prof.txt` does not exist yet, so
# the shipped APK carries no baseline profile — the Java/Kotlin side of
# startup (FlutterLoader, PlezyActivity, plugin registration,
# ExoPlayer/mpv init) runs uncompiled on first launch. The Macrobenchmark
# module (`android/benchmark/`, `StartupBenchmark.kt`) collects the
# profile from the real startup journey and measures
# `timeToInitialDisplay` with and without it. Generation needs a real
# device/emulator and a release-shaped (R8) build, so it runs here in CI,
# not locally (the local Gradle build is blocked).
#
# What this job does, in order:
#   1. Generates `baseline-prof.txt` on an x86_64 API 31 emulator
#      (the profile is a list of class/method names — ABI-independent,
#      so the fast KVM emulator stands in for the arm64 TV; the T1
#      matrix AVD in `tool/emulator-matrix/` is the slow-path local
#      equivalent).
#   2. Copies the generated profile into `android/app/src/main/` and
#      runs the two startup tests on the same job — `None` vs
#      `Partial(BaselineProfileMode.Require)` — so the run records the
#      actual `timeToInitialDisplay` numbers.
#   3. Uploads the profile + the benchmark results as workflow artifacts.
#
# What it does NOT do: commit anything. The generated profile ships only
# after a human downloads the artifact, reviews it, and commits
# `android/app/src/main/baseline-prof.txt` to main — a later release tag
# then picks it up automatically (AGP ships it in the APK) and
# ProfileInstaller applies it on sideloaded installs. Do NOT claim a
# measured startup improvement until this job has run and the numbers are
# in the run log.
#
# Trigger: manual only (`workflow_dispatch`). Generation is slow
# (~20–40 min: emulator boot + profile collection + 2×5 startup
# iterations) and the output needs review before it ships.
#
# First-run proof owed: this workflow has never run. If the "Live TV"
# UI selector in `StartupBenchmark.runStartupJourney` no longer matches
# the real tab label, the generation run fails loudly (10 s wait timeout)
# rather than silently producing an empty profile — check the run log
# for that failure first.

name: Baseline profile

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter 3.47.9
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable

      - name: Get Flutter packages
        run: flutter pub get

      - name: Generate baseline profile
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          arch: x86_64
          target: google_apis
          script: |
            ./gradlew :benchmark:connectedBenchmarkAndroidTest \
              -Pandroid.testInstrumentationRunnerArguments.class=com.plentv.app.benchmark.StartupBenchmark#generateBaselineProfile

      - name: Copy the generated profile into the app
        run: |
          GENERATED="$(find android/benchmark/build -name 'baseline-prof.txt' -print -quit)"
          if [ -z "$GENERATED" ]; then
            echo "::error::No baseline-prof.txt was generated — see the generation step log (a 'Live TV' selector timeout means the journey's UI selector no longer matches the real tab label)."
            exit 1
          fi
          echo "Generated profile: $GENERATED ($(wc -l < "$GENERATED") lines)"
          cp "$GENERATED" android/app/src/main/baseline-prof.txt

      - name: Measure startup without the profile
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          arch: x86_64
          target: google_apis
          script: |
            ./gradlew :benchmark:connectedBenchmarkAndroidTest \
              -Pandroid.testInstrumentationRunnerArguments.class=com.plentv.app.benchmark.StartupBenchmark#startupNoCompilation

      - name: Measure startup with the profile
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          arch: x86_64
          target: google_apis
          script: |
            ./gradlew :benchmark:connectedBenchmarkAndroidTest \
              -Pandroid.testInstrumentationRunnerArguments.class=com.plentv.app.benchmark.StartupBenchmark#startupWithBaselineProfile

      - name: Upload the profile and the benchmark results
        uses: actions/upload-artifact@v7
        with:
          name: baseline-profile
          path: |
            android/app/src/main/baseline-prof.txt
            android/benchmark/build/outputs/androidTest-results/connected/
            android/benchmark/build/outputs/connected_android_test_additional_output/
          if-no-files-found: error
